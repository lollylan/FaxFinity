<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FaxFinity</title>
<style>
  :root {
    --hg: #f4f6f9; --karte: #ffffff; --rand: #dfe4ec; --text: #1b2330;
    --gedaempft: #5d6a7e; --akzent: #2a6df4; --gut: #16794a; --warn: #a45a00;
    --schlecht: #b3261e; --schatten: 0 1px 3px rgba(20,30,50,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --hg: #12161d; --karte: #1a1f28; --rand: #2b323e; --text: #e8ecf2;
      --gedaempft: #98a4b6; --akzent: #6c9bff; --gut: #4ec98a; --warn: #e6a44a;
      --schlecht: #f2836f; --schatten: 0 1px 3px rgba(0,0,0,.4);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--hg); color: var(--text);
    font: 15px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  .huelle { max-width: 1120px; margin: 0 auto; padding: 24px 20px 64px; }

  header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -.2px; }
  .version { color: var(--gedaempft); font-size: 13px; }

  .karte {
    background: var(--karte); border: 1px solid var(--rand); border-radius: 10px;
    padding: 18px 20px; margin-bottom: 16px; box-shadow: var(--schatten);
  }
  .karte h2 {
    font-size: 13px; text-transform: uppercase; letter-spacing: .6px;
    color: var(--gedaempft); margin: 0 0 14px; font-weight: 600;
  }

  .ampeln { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
  .ampel { display: flex; align-items: flex-start; gap: 10px; }
  .punkt { width: 9px; height: 9px; border-radius: 50%; margin-top: 7px; flex: none; background: var(--gedaempft); }
  .punkt.gut { background: var(--gut); } .punkt.schlecht { background: var(--schlecht); }
  .ampel b { display: block; font-size: 13px; font-weight: 600; }
  .ampel span { font-size: 13px; color: var(--gedaempft); overflow-wrap: anywhere; }

  .zahlen { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
  .zahl { text-align: left; }
  .zahl b { display: block; font-size: 26px; font-weight: 650; letter-spacing: -.5px; }
  .zahl span { font-size: 12px; color: var(--gedaempft); text-transform: uppercase; letter-spacing: .4px; }

  .laufband {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    background: color-mix(in srgb, var(--akzent) 10%, transparent);
    border-radius: 7px; font-size: 14px; margin-top: 14px;
  }
  .dreher {
    width: 13px; height: 13px; border: 2px solid var(--akzent); border-right-color: transparent;
    border-radius: 50%; animation: dreh .8s linear infinite; flex: none;
  }
  @keyframes dreh { to { transform: rotate(360deg); } }

  button {
    font: inherit; font-weight: 550; padding: 8px 16px; border-radius: 7px;
    border: 1px solid var(--rand); background: var(--karte); color: var(--text); cursor: pointer;
  }
  button:hover { border-color: var(--akzent); color: var(--akzent); }
  button.haupt { background: var(--akzent); border-color: var(--akzent); color: #fff; }
  button.haupt:hover { filter: brightness(1.08); color: #fff; }
  button:disabled { opacity: .5; cursor: default; filter: none; }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th {
    text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .5px;
    color: var(--gedaempft); padding: 0 10px 8px 0; font-weight: 600; white-space: nowrap;
  }
  td { padding: 9px 10px 9px 0; border-top: 1px solid var(--rand); vertical-align: top; }
  td.name { font-family: "Cascadia Mono", Consolas, monospace; font-size: 12.5px; overflow-wrap: anywhere; }
  .tabellenrahmen { overflow-x: auto; }

  .marke {
    display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11.5px;
    font-weight: 600; white-space: nowrap;
  }
  .m-erfolg { background: color-mix(in srgb, var(--gut) 16%, transparent); color: var(--gut); }
  .m-unsicher { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
  .m-duplikat { background: color-mix(in srgb, var(--gedaempft) 18%, transparent); color: var(--gedaempft); }
  .m-fehler { background: color-mix(in srgb, var(--schlecht) 16%, transparent); color: var(--schlecht); }
  .hinweis { font-size: 12px; color: var(--warn); margin-top: 3px; }

  details.einst summary {
    cursor: pointer; font-size: 13px; text-transform: uppercase; letter-spacing: .6px;
    color: var(--gedaempft); font-weight: 600; list-style: none;
  }
  details.einst summary::before { content: "▸ "; }
  details.einst[open] summary::before { content: "▾ "; }
  .felder { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); margin-top: 18px; }
  .feld label { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 4px; }
  .feld small { display: block; color: var(--gedaempft); font-size: 12px; margin-bottom: 5px; }
  input[type=text], input[type=number], select {
    width: 100%; font: inherit; font-size: 14px; padding: 7px 9px;
    border: 1px solid var(--rand); border-radius: 6px; background: var(--hg); color: var(--text);
  }
  .schalter { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .mit-knopf { display: flex; gap: 6px; }
  .mit-knopf input { flex: 1; min-width: 0; }
  .mit-knopf button { flex: none; padding: 7px 12px; font-size: 13px; }
  .warnung {
    font-size: 12.5px; color: var(--warn); margin-top: 5px; line-height: 1.4;
  }

  /* Ordnerauswahl */
  .schleier {
    position: fixed; inset: 0; background: rgba(10,15,25,.55);
    display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 50;
  }
  .schleier[hidden] { display: none; }
  .waehler {
    background: var(--karte); border: 1px solid var(--rand); border-radius: 10px;
    width: min(620px, 100%); max-height: min(560px, 90vh); display: flex; flex-direction: column;
    box-shadow: 0 12px 40px rgba(0,0,0,.3);
  }
  .waehler header {
    padding: 16px 18px 12px; border-bottom: 1px solid var(--rand); display: block; margin: 0;
  }
  .waehler h3 { margin: 0 0 10px; font-size: 15px; }
  .pfadleiste {
    font-family: "Cascadia Mono", Consolas, monospace; font-size: 12.5px;
    background: var(--hg); border: 1px solid var(--rand); border-radius: 6px;
    padding: 7px 9px; overflow-wrap: anywhere;
  }
  .laufwerke { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .laufwerke button { padding: 4px 10px; font-size: 12.5px; }
  .liste { overflow-y: auto; padding: 6px 0; flex: 1; min-height: 120px; }
  .liste button {
    display: block; width: 100%; text-align: left; border: none; background: none;
    padding: 8px 18px; border-radius: 0; font-size: 14px;
  }
  .liste button:hover { background: color-mix(in srgb, var(--akzent) 12%, transparent); color: var(--text); }
  .waehler footer {
    padding: 12px 18px; border-top: 1px solid var(--rand);
    display: flex; gap: 10px; justify-content: flex-end; align-items: center;
  }
  .waehler footer .meldung { margin-right: auto; }
  .fussleiste { display: flex; align-items: center; gap: 12px; margin-top: 18px; flex-wrap: wrap; }
  .meldung { font-size: 13px; }
  .meldung.gut { color: var(--gut); } .meldung.schlecht { color: var(--schlecht); }
  .leer { color: var(--gedaempft); font-size: 14px; padding: 12px 0; }
</style>
</head>
<body>
<div class="huelle">

  <header>
    <h1>FaxFinity</h1>
    <span class="version" id="version"></span>
  </header>

  <div class="karte">
    <h2>Systemzustand</h2>
    <div class="ampeln" id="ampeln"><div class="leer">wird geprüft …</div></div>
  </div>

  <div class="karte">
    <h2>Betrieb</h2>
    <div class="zahlen" id="zahlen"></div>
    <div id="laufband"></div>
    <div class="fussleiste">
      <button class="haupt" id="knopfPruefen">Eingang jetzt prüfen</button>
      <span class="meldung" id="betriebsmeldung"></span>
    </div>
  </div>

  <div class="karte">
    <h2>Zuletzt verarbeitet</h2>
    <div class="tabellenrahmen">
      <table>
        <thead><tr>
          <th>Zeit</th><th>Eingegangen als</th><th>Abgelegt als</th>
          <th>Absender</th><th>Patient</th><th>Ergebnis</th>
        </tr></thead>
        <tbody id="protokoll"></tbody>
      </table>
    </div>
  </div>

  <div class="karte">
    <details class="einst" id="einstellungen">
      <summary>Einstellungen</summary>
      <div class="felder" id="felder"></div>
      <div class="fussleiste">
        <button class="haupt" id="knopfSpeichern">Speichern</button>
        <span class="meldung" id="speichermeldung"></span>
      </div>
    </details>
  </div>

</div>

<div class="schleier" id="schleier" hidden>
  <div class="waehler" role="dialog" aria-modal="true" aria-labelledby="waehlerTitel">
    <header>
      <h3 id="waehlerTitel">Ordner auswählen</h3>
      <div class="pfadleiste" id="waehlerPfad"></div>
      <div class="laufwerke" id="waehlerLaufwerke"></div>
    </header>
    <div class="liste" id="waehlerListe"></div>
    <footer>
      <span class="meldung schlecht" id="waehlerMeldung"></span>
      <button id="waehlerAbbrechen">Abbrechen</button>
      <button class="haupt" id="waehlerUebernehmen">Diesen Ordner nehmen</button>
    </footer>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);

// Beschriftung, Erklärung und Eingabeart je Einstellung.
const FELDER = [
  ["eingangsordner",    "Eingangsordner",        "Ordner, in dem die Faxe ankommen", "ordner"],
  ["zielordner",        "Ausgangsordner",        "Wohin die umbenannten Faxe kommen. Leer = Unterordner „Umbenannt“", "ordner"],
  ["archivordner",      "Archivordner",          "Sicherungskopien. Leer = Unterordner „Archiv“", "ordner"],
  ["praxis_name",       "Name der Praxis",       "Wird nie als Absender übernommen", "text"],
  ["praxis_strasse",    "Anschrift der Praxis",  "Hilft, den Empfängerblock zu erkennen", "text"],
  ["praxis_faxnummer",  "Eigene Faxnummer",      "Eindeutiges Erkennungsmerkmal des Empfängers", "text"],
  ["kategorien",        "Kategorien",            "Durch Komma getrennt. Nur diese darf das Modell vergeben — „Sonstiges“ kommt immer dazu", "liste"],
  ["ollama_modell",     "Sprachmodell",          "Leer lassen für automatische Wahl", "modell"],
  ["ollama_url",        "Ollama-Adresse",        "Normalerweise unverändert lassen", "text"],
  ["scan_intervall",    "Prüfabstand (Sekunden)","Wie oft der Eingang durchgesehen wird", "number"],
  ["max_seiten",        "Seiten je Fax",         "Mehr Seiten kosten Zeit, bringen selten mehr", "number"],
  ["ollama_timeout",    "Zeitlimit (Sekunden)",  "Abbruch, wenn das Modell zu lange braucht", "number"],
  ["auto_scan",         "Automatisch verarbeiten","Abschalten hält den Dienst an", "schalter"],
  ["ollama_denkmodus",  "Gründliche Auswertung", "Etwa doppelte Zeit, dafür genauer", "schalter"],
  ["umlaute_umschreiben","Umlaute umschreiben",  "Aus „Müller“ wird „Mueller“", "schalter"],
  ["netzwerkzugriff",   "Zugriff aus dem Netz",  "Oberfläche für andere Rechner im Praxisnetz öffnen", "schalter",
   "Ohne Anmeldung erreichbar und zeigt Patientennamen. Wirkt erst nach einem Neustart von FaxFinity."],
];

let modelle = [];
let einstellungen = {};

function markeFuer(ergebnis) {
  const texte = { erfolg: "erkannt", unsicher: "unsicher", duplikat: "Duplikat", fehler: "Fehler" };
  return `<span class="marke m-${ergebnis}">${texte[ergebnis] || ergebnis}</span>`;
}

function sicher(text) {
  const d = document.createElement("div");
  d.textContent = text ?? "";
  return d.innerHTML;
}

async function hole(pfad, einstell) {
  const antwort = await fetch(pfad, einstell);
  if (!antwort.ok) throw new Error((await antwort.json().catch(() => ({}))).fehler || antwort.statusText);
  return antwort.json();
}

async function systemZeichnen() {
  try {
    const s = await hole("/api/system");
    const zeilen = [
      ["Eingangsordner", s.ordner],
      ["Texterkennung", s.ocr],
      ["Sprachmodell", s.ollama],
    ];
    $("ampeln").innerHTML = zeilen.map(([titel, z]) => `
      <div class="ampel">
        <div class="punkt ${z.bereit ? "gut" : "schlecht"}"></div>
        <div><b>${titel}</b><span>${sicher(z.meldung)}</span></div>
      </div>`).join("");
    modelle = s.ollama.modelle || [];
  } catch (f) {
    $("ampeln").innerHTML = `<div class="leer">Zustand nicht abrufbar: ${sicher(f.message)}</div>`;
  }
}

async function zustandZeichnen() {
  const z = await hole("/api/zustand");
  const d = z.dienst, k = z.kennzahlen;
  $("version").textContent = "Version " + z.version;

  $("zahlen").innerHTML = [
    ["Im Eingang", d.wartende_dateien],
    ["Erkannt", k.erfolg],
    ["Unsicher", k.unsicher],
    ["Fehler", k.fehler],
    ["Insgesamt", k.gesamt],
  ].map(([t, w]) => `<div class="zahl"><b>${w ?? 0}</b><span>${t}</span></div>`).join("");

  $("laufband").innerHTML = d.beschaeftigt
    ? `<div class="laufband"><div class="dreher"></div><span>Verarbeite <b>${sicher(d.aktuelle_datei)}</b> …</span></div>`
    : "";

  const meldung = $("betriebsmeldung");
  if (!d.laeuft) {
    meldung.textContent = "Dienst läuft nicht";
    meldung.className = "meldung schlecht";
  } else if (d.letzter_fehler) {
    meldung.textContent = d.letzter_fehler;
    meldung.className = "meldung schlecht";
  } else {
    meldung.textContent = d.letzter_lauf ? `Zuletzt geprüft: ${d.letzter_lauf}` : "Dienst läuft";
    meldung.className = "meldung";
  }
}

async function protokollZeichnen() {
  const eintraege = await hole("/api/protokoll?anzahl=40");
  if (!eintraege.length) {
    $("protokoll").innerHTML = `<tr><td colspan="6" class="leer">Noch nichts verarbeitet.</td></tr>`;
    return;
  }
  $("protokoll").innerHTML = eintraege.map((e) => {
    const hinweise = (e.hinweise || []).concat(e.meldung ? [e.meldung] : []);
    return `<tr>
      <td>${sicher((e.zeitpunkt || "").replace("T", " ").slice(5, 16))}</td>
      <td class="name">${sicher(e.quelldatei)}</td>
      <td class="name">${sicher(e.zieldatei)}
        ${hinweise.map((h) => `<div class="hinweis">${sicher(h)}</div>`).join("")}</td>
      <td>${sicher(e.absender)}</td>
      <td>${sicher(e.patient)}</td>
      <td>${markeFuer(e.ergebnis)}</td>
    </tr>`;
  }).join("");
}

function felderZeichnen() {
  $("felder").innerHTML = FELDER.map(([schluessel, titel, hilfe, art, warnung]) => {
    const wert = einstellungen[schluessel];
    let eingabe;
    if (art === "schalter") {
      eingabe = `<label class="schalter"><input type="checkbox" id="f_${schluessel}" ${wert ? "checked" : ""}> aktiv</label>`;
    } else if (art === "modell") {
      const auswahl = ['<option value="">automatisch wählen</option>']
        .concat(modelle.map((m) => `<option value="${sicher(m)}"${m === wert ? " selected" : ""}>${sicher(m)}</option>`));
      eingabe = `<select id="f_${schluessel}">${auswahl.join("")}</select>`;
    } else if (art === "ordner") {
      eingabe = `<div class="mit-knopf">
        <input type="text" id="f_${schluessel}" value="${sicher(wert)}">
        <button type="button" data-ordnerfeld="${schluessel}">Durchsuchen</button>
      </div>`;
    } else if (art === "liste") {
      eingabe = `<input type="text" id="f_${schluessel}" value="${sicher((wert || []).join(", "))}">`;
    } else {
      eingabe = `<input type="${art}" id="f_${schluessel}" value="${sicher(wert)}">`;
    }
    return `<div class="feld">
      <label for="f_${schluessel}">${titel}</label><small>${hilfe}</small>${eingabe}
      ${warnung ? `<div class="warnung">${warnung}</div>` : ""}
    </div>`;
  }).join("");

  for (const knopf of document.querySelectorAll("[data-ordnerfeld]")) {
    knopf.onclick = () => ordnerWaehlen(knopf.dataset.ordnerfeld);
  }
}

// ── Ordnerauswahl ────────────────────────────────────────────────────────
let waehlerPfad = "";
let waehlerZielfeld = null;

async function waehlerLaden(pfad) {
  const daten = await hole("/api/ordner?pfad=" + encodeURIComponent(pfad || ""));
  waehlerPfad = daten.pfad;
  $("waehlerPfad").textContent = daten.pfad || "Dieser Computer";
  $("waehlerMeldung").textContent = daten.fehler || "";
  $("waehlerUebernehmen").disabled = !daten.pfad;

  $("waehlerLaufwerke").innerHTML = (daten.laufwerke || [])
    .map((l) => `<button type="button" data-ziel="${sicher(l)}">${sicher(l)}</button>`).join("");

  const eintraege = [];
  if (daten.eltern !== null && daten.eltern !== undefined) {
    eintraege.push(`<button type="button" data-ziel="${sicher(daten.eltern)}">.. eine Ebene höher</button>`);
  }
  for (const o of daten.unterordner) {
    eintraege.push(`<button type="button" data-ziel="${sicher(o.pfad)}">${sicher(o.name)}</button>`);
  }
  $("waehlerListe").innerHTML = eintraege.join("")
    || `<div class="leer" style="padding:12px 18px">Keine Unterordner.</div>`;

  for (const knopf of document.querySelectorAll("[data-ziel]")) {
    knopf.onclick = () => waehlerLaden(knopf.dataset.ziel);
  }
}

async function ordnerWaehlen(schluessel) {
  waehlerZielfeld = schluessel;
  $("schleier").hidden = false;
  const start = ($("f_" + schluessel).value || "").trim();
  try {
    await waehlerLaden(start);
  } catch {
    await waehlerLaden("");
  }
}

function waehlerSchliessen() {
  $("schleier").hidden = true;
  waehlerZielfeld = null;
}

$("waehlerAbbrechen").onclick = waehlerSchliessen;
$("waehlerUebernehmen").onclick = () => {
  if (waehlerZielfeld && waehlerPfad) $("f_" + waehlerZielfeld).value = waehlerPfad;
  waehlerSchliessen();
};
$("schleier").onclick = (e) => { if (e.target === $("schleier")) waehlerSchliessen(); };
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !$("schleier").hidden) waehlerSchliessen();
});

async function einstellungenLaden() {
  einstellungen = await hole("/api/einstellungen");
  felderZeichnen();
}

async function speichern() {
  const daten = {};
  for (const [schluessel, , , art] of FELDER) {
    const feld = $("f_" + schluessel);
    if (!feld) continue;
    daten[schluessel] = art === "schalter" ? feld.checked
                      : art === "number" ? Number(feld.value)
                      : art === "liste" ? feld.value.split(",").map((t) => t.trim()).filter(Boolean)
                      : feld.value;
  }
  const meldung = $("speichermeldung");
  try {
    await hole("/api/einstellungen", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(daten),
    });
    meldung.textContent = "Gespeichert";
    meldung.className = "meldung gut";
    einstellungen = { ...einstellungen, ...daten };
    await systemZeichnen();
  } catch (f) {
    meldung.textContent = f.message;
    meldung.className = "meldung schlecht";
  }
  setTimeout(() => { meldung.textContent = ""; }, 5000);
}

$("knopfSpeichern").onclick = speichern;
$("knopfPruefen").onclick = async (e) => {
  e.target.disabled = true;
  try { await hole("/api/pruefen", { method: "POST" }); } catch { /* Anzeige folgt im Takt */ }
  setTimeout(() => { e.target.disabled = false; }, 1500);
};

async function takt() {
  try { await zustandZeichnen(); await protokollZeichnen(); } catch { /* Netz kurz weg */ }
}

(async function start() {
  await systemZeichnen();
  await einstellungenLaden();
  await takt();
  setInterval(takt, 3000);
  setInterval(systemZeichnen, 30000);
})();
</script>
</body>
</html>
